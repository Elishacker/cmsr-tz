<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Vision">
  <title>Vision</title>

  <!-- Lashes radiating from the top, as on the CMSR-TZ office banner -->
  <g stroke="#12395f" stroke-width="5.5" stroke-linecap="round">
    <line x1="48" y1="4"  x2="48" y2="17"/>
    <line x1="29" y1="8"  x2="34" y2="20"/>
    <line x1="67" y1="8"  x2="62" y2="20"/>
    <line x1="13" y1="19" x2="22" y2="28"/>
    <line x1="83" y1="19" x2="74" y2="28"/>
    <line x1="4"  y1="35" x2="16" y2="40"/>
    <line x1="92" y1="35" x2="80" y2="40"/>
  </g>

  <!-- Eyeball -->
  <circle cx="48" cy="57" r="31" fill="#ffffff" stroke="#12395f" stroke-width="3.5"/>

  <!-- Iris -->
  <circle cx="48" cy="57" r="18" fill="#2b8ede"/>
  <circle cx="48" cy="57" r="18" fill="none" stroke="#12395f" stroke-width="3"/>
  <circle cx="48" cy="57" r="12" fill="none" stroke="#1667ad" stroke-width="4" opacity=".85"/>

  <!-- Pupil and highlight -->
  <circle cx="48" cy="57" r="7.5" fill="#0a1c2e"/>
  <circle cx="41" cy="50" r="4.2" fill="#ffffff" opacity=".92"/>
  <circle cx="55" cy="65" r="2.2" fill="#ffffff" opacity=".55"/>
</svg>
