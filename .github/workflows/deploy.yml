name: Deploy to production (FTP)

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Folder on the FTP server to publish into — change if your host
          # doesn't serve straight from the account root (e.g. "/public_html/").
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          protocol: ftps
          # Never let this job delete files that only exist on the server —
          # staff uploads and cached thumbnails live there, not in git.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            # Production DB credentials + DEBUG flag live only on the server.
            # A fresh deploy must never overwrite this file — see README.md
            # step 3/6 for how it's set up there the first time.
            config/config.php
            # Staff-managed content and regenerable cache: never sync these.
            uploads/**
            cache/**
